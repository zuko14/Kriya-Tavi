name: Bug report
description: Something isn't working as it should
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report this. Please **don't include API keys, tokens or private conversation content.**
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: A clear description of the bug.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Create an agent with …
        2. Ask it to …
        3. See …
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Agents / chat
        - Workstations (Docker)
        - Web tools (Firecrawl)
        - Squads / delegation
        - Model providers
        - Telegram remote access
        - Settings / setup
        - UI / design
        - Other
    validations:
      required: true
  - type: input
    id: model
    attributes:
      label: Model
      placeholder: openai/gpt-6-luna
  - type: input
    id: version
    attributes:
      label: Kriya version or commit
      placeholder: v0.1.0
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: OS and Node version
      placeholder: macOS 26 · Node 22.17
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Relevant terminal output. Remove anything sensitive.
      render: text
